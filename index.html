<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch-a-Sketch</title>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="main">
    <div class="grid">
      <button id="reset">Reset</button>
      <button id="resize">Resize</button>
    </div>
    <div class="container"></div>
    <div class="color"> Color Mode:
      <label><input type="radio" name="mode" value="single" checked>Single</label>
      <label><input type="radio" name="mode" value="random">Random</label>
      <label><input type="radio" name="mode" value="shade">Shade</label>
    </div>
  </div>
</body>
</html>
